backend:
  name: github
  repo: hanamanajun-sudo/trip-blog
  branch: master

media_folder: public/images
public_folder: /images

locale: ko

collections:
  - name: blog
    label: 블로그 글
    label_singular: 글
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "여행"
          - "해외 여행"
          - "국내 여행"
          - "지구 상식"
          - "캠핑"
          - "커피"
          - "지구 위기& 재난 대비"
          - "유튜버 되기 자료"
        default: "여행"
      - { label: "URL 슬러그", name: "entry_slug", widget: "string", required: false, hint: "원래 티스토리 URL 경로 (예: 나라-비교)" }
      - { label: "요약 설명", name: "description", widget: "text", required: false }
      - { label: "썸네일 이미지", name: "thumbnail", widget: "image", required: false }
      - { label: "본문", name: "body", widget: "markdown" }
